<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EVOLVIA — Living World</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101913;color:#e8f0df;font:14px system-ui}header{padding:12px 18px;background:#1c2b20;display:flex;gap:18px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0;color:#b9e58a}button,select{background:#304832;color:white;border:1px solid #587458;border-radius:7px;padding:7px 11px;cursor:pointer}main{display:grid;grid-template-columns:minmax(0,1fr) 290px;height:calc(100vh - 54px)}canvas{width:100%;height:100%;display:block;background:#6c9856}aside{overflow:auto;background:#17251b;padding:12px;border-left:1px solid #344a36}h3{margin:8px 0;color:#b9e58a}.stat{display:inline-block;margin-right:12px;color:#d8e9c8}.entry{padding:7px;margin:6px 0;background:#243729;border-radius:6px;font-size:12px}.muted{color:#9bb19a}@media(max-width:700px){main{grid-template-columns:1fr;grid-template-rows:65vh 1fr;height:auto}aside{border-left:0}canvas{height:65vh}}
</style></head><body>
<header><h1>🌍 EVOLVIA</h1><span class="stat" id="day">День 1</span><span class="stat" id="pop">Жители: 0</span><span class="stat" id="food">Еда: 0</span><button id="pause">Пауза</button><button id="faster">Скорость ×2</button><button id="save">Сохранить</button><button id="reset">Новый мир</button></header>
<main><canvas id="world"></canvas><aside><h3>🧠 Центр наблюдения</h3><p class="muted">Выбери жителя на карте, чтобы увидеть его состояние. Поведение — автономная игровая модель на правилах и потребностях, не подключённая языковая нейросеть.</p><div id="profile" class="entry">Нажми на жителя.</div><h3>💬 Мысли и события</h3><div id="feed"></div></aside></main>
<script>
(()=>{const c=document.querySelector('#world'),ctx=c.getContext('2d');let W=100,H=70,tiles=[],people=[],houses=[],day=1,paused=false,mult=1,food=30,wood=20,selected=null,logs=[],tick=0;
const rand=n=>Math.floor(Math.random()*n),pick=a=>a[rand(a.length)],log=s=>{logs.unshift('День '+day+': '+s);logs=logs.slice(0,35);document.querySelector('#feed').innerHTML=logs.map(x=>'<div class="entry">'+x+'</div>').join('')};
function init(){tiles=[];people=[];houses=[];food=30;wood=20;day=1;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v=Math.random();tiles.push(v<.08?2:v<.18?1:0)}for(let i=0;i<12;i++){let p=spawn();p.name=pick(['Ари','Мира','Тар','Лея','Эн','Роан','Ника','Сэм'])}houses.push({x:50,y:35});log('Первые семьи основали поселение.')}
function spawn(){let x=45+rand(11),y=30+rand(11);while(tiles[y*W+x]===2){x=45+rand(11);y=30+rand(11)}let p={id:Math.random(),name:'Житель '+(people.length+1),x,y,tx:x,ty:y,hunger:rand(30),energy:70+rand(30),age:rand(30),wood:0,goal:'исследует окрестности',thought:'Интересно, что находится за холмом?',color:pick(['#e7c08d','#d8a36f','#f0d4b0'])};people.push(p);return p}
function choose(p){if(p.hunger>65){p.goal='ищет пищу';p.thought='Нужно найти ягоды, я проголодался.';p.tx=p.x+rand(15)-7;p.ty=p.y+rand(15)-7;food=Math.max(0,food-1)}else if(p.energy<25){p.goal='отдыхает';p.thought='Пора отдохнуть в поселении.';let h=pick(houses);p.tx=h.x;p.ty=h.y}else if(wood<35&&Math.random()<.45){p.goal='собирает древесину';p.thought='Нам нужны материалы для новых домов.';p.tx=rand(W);p.ty=rand(H)}else if(people.length<24&&wood>=12&&Math.random()<.16){p.goal='строит дом';p.thought='Построим место для новой семьи.';p.tx=p.x;p.ty=p.y}else{p.goal='общается или исследует';p.thought='Как сделать наше поселение безопаснее?';let q=pick(people);p.tx=q.x+rand(9)-4;p.ty=q.y+rand(9)-4}}
function step(){day++;tick++;for(let p of people){p.age++;p.hunger=Math.min(100,p.hunger+2);p.energy=Math.max(0,p.energy-1);if(Math.random()<.22||Math.hunger>90)choose(p);if(p.x<p.tx)p.x+=.22;if(p.x>p.tx)p.x-=.22;if(p.y<p.ty)p.y+=.22;if(p.y>p.ty)p.y-=.22;if(p.goal==='собирает древесину'&&Math.random()<.12){wood++;p.energy-=2}if(p.goal==='ищет пищу'&&Math.random()<.16){food+=2;p.hunger=Math.max(0,p.hunger-25);log(p.name+' нашёл съедобные ягоды.')}if(p.goal==='строит дом'&&wood>=12&&Math.random()<.08){houses.push({x:Math.round(p.x),y:Math.round(p.y)});wood-=12;log(p.name+' построил новый дом.')}}people=people.filter(p=>{if(p.hunger>=100||p.energy<=0){log(p.name+' погиб — не хватило сил.');return false}return true});if(people.length<3&&food>5&&Math.random()<.2){let p=spawn();log('Родился новый житель: '+p.name+'.')}if(tick%8===0&&people.length>1&&Math.random()<.5)log(pick(people).name+' поговорил с соседями о запасах и будущем.');}
function draw(){let dpr=devicePixelRatio||1,rect=c.getBoundingClientRect();if(c.width!==Math.floor(rect.width*dpr)||c.height!==Math.floor(rect.height*dpr)){c.width=rect.width*dpr;c.height=rect.height*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);let cw=rect.width,ch=rect.height,tw=Math.min(cw/(W+H)*1.7, ch/(W+H)*1.1),th=tw*.5,ox=cw/2,oy=20;ctx.clearRect(0,0,cw,ch);
for(let y=0;y<H;y++)for(let x=0;x<W;x++){let sx=ox+(x-y)*tw/2,sy=oy+(x+y)*th/2;if(sx<-tw||sx>cw+tw||sy<-th||sy>ch+th)continue;let t=tiles[y*W+x];ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+tw/2,sy+th/2);ctx.lineTo(sx,sy+th);ctx.lineTo(sx-tw/2,sy+th/2);ctx.closePath();ctx.fillStyle=t===2?'#477da0':t===1?'#829b5b':'#79a95e';ctx.fill();ctx.strokeStyle='rgba(25,55,30,.12)';ctx.stroke();if(t===1){ctx.fillStyle='#285c35';ctx.beginPath();ctx.arc(sx,sy+th/2,tw*.17,0,7);ctx.fill()}}
for(let h of houses){let sx=ox+(h.x-h.y)*tw/2,sy=oy+(h.x+h.y)*th/2;ctx.fillStyle='#c6a276';ctx.fillRect(sx-tw*.17,sy-tw*.32,tw*.34,tw*.24);ctx.fillStyle='#874c36';ctx.beginPath();ctx.moveTo(sx-tw*.22,sy-tw*.32);ctx.lineTo(sx,sy-tw*.48);ctx.lineTo(sx+tw*.22,sy-tw*.32);ctx.fill()}
for(let p of people){let sx=ox+(p.x-p.y)*tw/2,sy=oy+(p.x+p.y)*th/2;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(sx,sy-tw*.12,Math.max(3,tw*.09),0,7);ctx.fill();ctx.fillStyle='#26342a';ctx.fillRect(sx-tw*.045,sy-tw*.02,tw*.09,tw*.19);if(selected===p){ctx.strokeStyle='#fff36a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(sx,sy-tw*.08,tw*.18,0,7);ctx.stroke()}}
document.querySelector('#day').textContent='День '+day;document.querySelector('#pop').textContent='Жители: '+people.length;document.querySelector('#food').textContent='Еда: '+food+' · Дерево: '+wood}
function frame(){if(!paused&&Math.random()<.13*mult)step();draw();requestAnimationFrame(frame)}
c.addEventListener('click',e=>{let r=c.getBoundingClientRect(),cw=r.width,tw=Math.min(cw/(W+H)*1.7,r.height/(W+H)*1.1),ox=cw/2,oy=20,x=e.clientX-r.left-ox,y=e.clientY-r.top-oy;let a=(x/(tw/2)+y/(tw*.5))/2,b=(y/(tw*.5)-x/(tw/2))/2;selected=people.reduce((best,p)=>Math.hypot(p.x-a,p.y-b)<Math.hypot(best?.x-a||999,best?.y-b||999)?p:best,null);if(selected)document.querySelector('#profile').innerHTML='<b>'+selected.name+'</b><br>Цель: '+selected.goal+'<br>Мысль: «'+selected.thought+'»<br>Возраст: '+selected.age+'<br>Голод: '+selected.hunger+'% · Энергия: '+selected.energy+'%';});
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Продолжить':'Пауза'};document.querySelector('#faster').onclick=()=>{mult=mult===1?2:mult===2?4:1;document.querySelector('#faster').textContent='Скорость ×'+mult};document.querySelector('#save').onclick=()=>{localStorage.setItem('evolvia-save',JSON.stringify({tiles,people,houses,day,food,wood}));log('Мир сохранён в этом браузере.')};document.querySelector('#reset').onclick=()=>{if(confirm('Создать новый мир?'))init()};let s=localStorage.getItem('evolvia-save');if(s){try{let v=JSON.parse(s);({tiles,people,houses,day,food,wood}=v)}catch(e){init()}}else init();frame();
})();
</script></body></html>
